name: Build Media Buddy (Windows .exe)

on:
  push:
    paths:
      - "media-buddy/**"
      - ".github/workflows/media-buddy-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: media-buddy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller==6.11.1

      - name: Self-test scan engine
        run: python -m unittest discover -s tests -v

      - name: Build single-file exe
        run: pyinstaller --noconfirm --onefile --windowed --name MediaBuddy MediaBuddy.py

      - uses: actions/upload-artifact@v4
        with:
          name: MediaBuddy-windows
          path: media-buddy/dist/MediaBuddy.exe
